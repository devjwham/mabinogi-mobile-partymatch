<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f4f4f4" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Noto Sans KR", sans-serif;
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        width: 300px;
        text-align: center;
      }

      .title {
        font-weight: 700;
        font-size: 24px;
        margin-bottom: 4px;
      }
      .subtitle {
        font-weight: 400;
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
      }

      .input-wrapper {
        border: 2px solid #333;
        border-radius: 6px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
        align-items: stretch;
      }

      input[type="text"],
      input[type="password"] {
        padding: 8px 12px;
        font-size: 14px;
        border: 1.5px solid #999;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s ease;
      }
      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: #333;
      }

      button {
        padding: 8px 14px;
        font-weight: 700;
        font-size: 14px;
        border: 2px solid #333;
        background-color: white;
        color: #333;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      button:hover {
        background-color: #333;
        color: white;
      }
      footer {
        margin-top: auto;
        width: 100%;
        max-width: 800px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="title">길드명</div>
      <div class="subtitle">파티시스템</div>

      <div class="input-wrapper">
        <input
          type="text"
          id="username"
          placeholder="닉네임을 입력하세요"
          onkeydown="if(event.key === 'Enter'){ document.querySelector('button').click(); }"
        />
        <input
          type="text"
          id="code"
          placeholder="코드를 입력하세요"
          onkeydown="if(event.key === 'Enter'){ document.querySelector('button').click(); }"
        />
        <button type="button">로그인</button>
      </div>

      <footer
        style="
          text-align: center;
          padding: 1.2em 0;
          font-size: 0.9em;
          color: #666;
          background: transparent;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        "
      >
        <hr style="margin-bottom: 10px; border-color: #ccc" />
        <div style="margin-top: 10px; font-size: 12px; color: #666">
          <a href="/privacy.html" target="_blank">개인정보처리방침</a>
        </div>
        <div style="font-size: 12px; color: #666; margin-top: 5px">
          ※ 본 서비스는 NEXON 또는 해당 게임의 공식 서비스와 무관하며, NEXON 및
          그 계열사(데브캣 스튜디오 포함)와 어떠한 제휴·승인·보증 관계도
          없습니다.
        </div>
        <div style="font-size: 12px; color: #666; margin-top: 5px">
          Contact: 이메일
        </div>
      </footer>
    </div>

    <script>
      const usernameInput = document.querySelector("#username");
      const codeInput = document.querySelector("#code");
      const button = document.querySelector("button");

      button.addEventListener("click", () => {
        const username = usernameInput.value.trim();
        const code = codeInput.value.trim();

        if (!username || !code) {
          alert("아이디와 코드를 모두 입력하세요");
          return;
        }

        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, code }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              alert(`${data.username}님 반갑습니다!`);
              window.location.href = "party.html";
            } else {
              alert(data.message || "로그인 실패");
            }
          })
          .catch(() => {
            alert("서버 오류가 발생했습니다");
          });
      });
    </script>
  </body>
</html>
